<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodlens: read the emotion in a sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101521; --ink:#eef1f7; --mute:#8d96ab; --line:rgba(255,255,255,.1);
  --accent:#8d96ab; --accent-rgb:141,150,171;
  --serif:'Instrument Serif',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--ink);font:400 16px/1.55 var(--sans);overflow-x:hidden;position:relative}
.washes{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wash{position:absolute;width:260vmax;height:260vmax;border-radius:50%;transform:translate(-50%,-50%) scale(0);will-change:transform}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:28px clamp(20px,5vw,40px) 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(40px,9vh,96px)}
.brand{font:400 26px var(--serif);letter-spacing:.01em}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(16,21,33,.5);backdrop-filter:blur(6px)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.ok i{background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:ping 2.4s infinite}
.pill.bad i{background:#ff5648}
@keyframes ping{70%,100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
textarea{width:100%;display:block;background:none;border:0;outline:0;resize:none;color:var(--ink);font:400 clamp(30px,5.6vw,56px)/1.12 var(--serif);caret-color:rgb(var(--accent-rgb));overflow:hidden;padding:0 0 16px;border-bottom:1px solid var(--line);transition:border-color .4s}
textarea::placeholder{color:rgba(238,241,247,.28)}
textarea:focus{border-color:rgba(var(--accent-rgb),.8)}
textarea.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:20px}
button{font:inherit;cursor:pointer}
#go{background:var(--ink);color:#101521;border:0;border-radius:99px;padding:13px 26px;font-weight:600;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .3s,opacity .2s}
#go:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(var(--accent-rgb),.7)}
#go:active{transform:scale(.97)}
#go[disabled]{opacity:.75;cursor:progress}
.spin{width:14px;height:14px;border:2px solid rgba(16,21,33,.25);border-top-color:#101521;border-radius:50%;display:none;animation:rot .7s linear infinite}
#go.busy .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.meta{color:var(--mute);font-size:13px}
.meta.count{margin-left:auto;font-variant-numeric:tabular-nums}
.tries{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;align-items:center}
.tries span{color:var(--mute);font-size:14px;margin-right:4px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:14px;transition:background .25s,border-color .25s,transform .2s}
.chip:hover{background:rgba(var(--accent-rgb),.16);border-color:rgba(var(--accent-rgb),.55);transform:translateY(-1px)}
:focus-visible{outline:2px solid rgb(var(--accent-rgb));outline-offset:3px}
#out{margin-top:clamp(48px,9vh,96px)}
.verdict{display:flex;align-items:center;gap:clamp(14px,3vw,28px)}
#emoji{font-size:clamp(56px,11vw,104px);line-height:1;display:inline-block;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-18deg);opacity:0}}
h2{font:400 clamp(64px,15vw,150px)/.95 var(--serif);letter-spacing:-.02em;color:rgb(var(--accent-rgb));display:flex;overflow:hidden;padding-bottom:.08em}
h2 span{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(105%)}}
#sum{margin-top:18px;font-size:18px;max-width:52ch}
#sum b{font-weight:600;font-variant-numeric:tabular-nums}
#sum em{display:block;color:var(--mute);font-size:15px;font-style:normal;margin-top:4px}
.spectrum{display:flex;gap:4px;height:44px;margin-top:32px}
.spectrum span{flex:0 1 0;min-width:0;border-radius:10px;background:var(--c);transition:flex-grow 1.1s cubic-bezier(.2,.8,.2,1);opacity:.9}
.spectrum span:first-child{opacity:1;box-shadow:0 0 30px -4px var(--c)}
.legend{list-style:none;padding:0;margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px 40px}
.legend li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--mute);cursor:default;transition:color .2s,padding .25s}
.legend li:hover{color:var(--ink);padding-left:6px}
.legend li.top{color:var(--ink);font-weight:500}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums}
#hist{margin-top:64px}
#hist h3{font:400 24px var(--serif);margin-bottom:12px}
#hist ul{list-style:none;padding:0;display:grid;gap:2px}
#hist button{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--mute);padding:11px 0;transition:color .2s,padding .25s}
#hist button:hover{color:var(--ink);padding-left:8px}
#hist i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
#hist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#hist em{font-style:normal;font-size:13px;flex:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#1c2233;border:1px solid rgba(255,86,72,.5);padding:12px 18px;border-radius:12px;max-width:calc(100vw - 40px);opacity:0;pointer-events:none;transition:.35s;z-index:5;font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="washes" id="washes" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand">Moodlens</div>
    <div class="pill" id="pill"><i></i><span>Checking model</span></div>
  </header>

  <main>
    <label for="t" style="position:absolute;left:-9999px">Sentence to analyze</label>
    <textarea id="t" rows="2" maxlength="2000" placeholder="How are you feeling right now?" autofocus></textarea>
    <div class="row">
      <button id="go" type="button"><span class="spin"></span><span id="goTxt">Read the emotion</span></button>
      <span class="meta">or press Ctrl + Enter</span>
      <span class="meta count" id="count">0 / 2000</span>
    </div>
    <div class="tries" id="tries">
      <span>Try one:</span>
    </div>

    <section id="out" hidden aria-live="polite">
      <div class="verdict"><span id="emoji"></span><h2 id="word"></h2></div>
      <p id="sum"></p>
      <div class="spectrum" id="spec" role="img" aria-label="Probability of each emotion"></div>
      <ul class="legend" id="legend"></ul>
    </section>

    <section id="hist" hidden>
      <h3>Recent readings</h3>
      <ul id="histList"></ul>
    </section>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
const COLORS = {sadness:'111,155,255', joy:'255,194,74', love:'255,111,159', anger:'255,86,72', fear:'169,139,255', surprise:'53,224,194'};
const SAMPLES = [
  'I am so happy and excited about my new job',
  'I miss you so much it hurts',
  'I am furious at how rudely they treated me',
  'I am terrified of walking alone in the dark',
  'I was stunned when I saw the gift'
];
const $ = s => document.querySelector(s);
const t = $('#t'), go = $('#go'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let history = [], busy = false, lastPoint = null;

/* storage is optional; the app works without it */
try { history = JSON.parse(localStorage.getItem('moodlens:v1') || '[]'); } catch (e) { history = []; }
const save = () => { try { localStorage.setItem('moodlens:v1', JSON.stringify(history)); } catch (e) {} };

/* textarea: auto-grow and counter */
function fit(){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; $('#count').textContent = t.value.length + ' / 2000'; }
t.addEventListener('input', fit);
t.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') analyze(); });
go.addEventListener('click', e => { lastPoint = {x:e.clientX, y:e.clientY}; analyze(); });

/* sample chips */
SAMPLES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = s.length > 34 ? s.slice(0, 32) + '…' : s;
  b.addEventListener('click', () => { t.value = s; fit(); lastPoint = null; analyze(); });
  $('#tries').appendChild(b);
});

/* server status */
async function checkHealth(){
  const pill = $('#pill'), label = pill.querySelector('span');
  try {
    const j = await (await fetch('/health')).json();
    pill.className = 'pill ' + (j.model_loaded ? 'ok' : '');
    label.textContent = j.model_loaded ? 'Model ready' : 'Model loading';
  } catch (e) { pill.className = 'pill bad'; label.textContent = 'Server unreachable'; }
}

function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => el.classList.remove('show'), 4200);
}

async function analyze(){
  const text = t.value.trim();
  if (busy) return;
  if (!text){ t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); t.focus(); return; }
  busy = true; go.disabled = true; go.classList.add('busy'); $('#goTxt').textContent = 'Reading…';
  try {
    const r = await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    if (!r.ok){
      let d = {}; try { d = await r.json(); } catch (e) {}
      throw new Error(r.status === 503 ? 'The model is still loading. Try again in a few seconds.'
        : r.status === 422 ? 'Enter between 1 and 2000 characters.' : (typeof d.detail === 'string' ? d.detail : 'The server returned an error.'));
    }
    const d = await r.json();
    render(d);
    history = [{text, d}, ...history.filter(h => h.text !== text)].slice(0, 6); save(); renderHistory();
    checkHealth();
  } catch (e) {
    toast(e instanceof TypeError ? 'Could not reach the server. Check that it is running, then try again.' : e.message);
    checkHealth();
  } finally {
    busy = false; go.disabled = false; go.classList.remove('busy'); $('#goTxt').textContent = 'Read the emotion';
  }
}

/* one orchestrated moment: the whole page washes into the emotion's color */
function bloom(rgb){
  const layer = document.createElement('div');
  const x = lastPoint ? lastPoint.x : innerWidth / 2, y = lastPoint ? lastPoint.y : innerHeight * .35;
  layer.className = 'wash';
  layer.style.cssText = `left:${x}px;top:${y}px;background:radial-gradient(circle,rgba(${rgb},.34) 0%,rgba(${rgb},.12) 32%,transparent 60%)`;
  const box = $('#washes'); box.appendChild(layer);
  const to = {transform:'translate(-50%,-50%) scale(1)'};
  if (reduce){ Object.assign(layer.style, to); }
  else { layer.animate([{transform:'translate(-50%,-50%) scale(0)'}, to], {duration:1500, easing:'cubic-bezier(.2,.7,.2,1)', fill:'forwards'}); }
  setTimeout(() => { while (box.children.length > 1) box.removeChild(box.firstChild); }, reduce ? 0 : 1550);
}

function countUp(el, to){
  if (reduce){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 1000;
  (function f(now){
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function render(d){
  const rgb = COLORS[d.predicted_emotion] || '141,150,171';
  const root = document.documentElement.style;
  root.setProperty('--accent-rgb', rgb); root.setProperty('--accent', `rgb(${rgb})`);
  bloom(rgb);

  $('#out').hidden = false;
  const emoji = $('#emoji'); emoji.textContent = d.emoji || '';
  emoji.style.animation = 'none'; void emoji.offsetWidth; emoji.style.animation = '';
  const word = $('#word'); word.innerHTML = '';
  [...d.predicted_emotion].forEach((ch, i) => {
    const s = document.createElement('span'); s.textContent = ch; s.style.animationDelay = (i * 45) + 'ms'; word.appendChild(s);
  });

  const pct = Math.round(d.confidence * 100);
  const sum = $('#sum');
  sum.innerHTML = `Most likely <b>${d.predicted_emotion}</b>, with <b><span id="pc">0</span>%</b> confidence.` +
    (pct < 50 ? '<em>The model is split between several emotions, so treat this as a lean rather than a verdict.</em>' : '');
  countUp($('#pc'), pct);

  const entries = Object.entries(d.all_probabilities).sort((a, b) => b[1] - a[1]);
  const spec = $('#spec'), legend = $('#legend'); spec.innerHTML = ''; legend.innerHTML = '';
  entries.forEach(([name, p], i) => {
    const c = `rgb(${COLORS[name]})`;
    const seg = document.createElement('span'); seg.style.setProperty('--c', c); seg.title = `${name} ${(p * 100).toFixed(1)}%`;
    spec.appendChild(seg);
    requestAnimationFrame(() => requestAnimationFrame(() => { seg.style.flexGrow = Math.max(p, 0.004); }));
    const li = document.createElement('li'); if (i === 0) li.className = 'top'; li.style.setProperty('--c', c);
    li.innerHTML = `<i></i>${name}<em>${(p * 100).toFixed(1)}%</em>`;
    legend.appendChild(li);
  });
  if (!reduce) $('#out').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderHistory(){
  const box = $('#hist'), list = $('#histList'); list.innerHTML = '';
  box.hidden = !history.length;
  history.forEach(h => {
    const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
    b.style.setProperty('--c', `rgb(${COLORS[h.d.predicted_emotion] || '141,150,171'})`);
    b.innerHTML = '<i></i><span></span><em></em>';
    b.querySelector('span').textContent = h.text;
    b.querySelector('em').textContent = h.d.predicted_emotion + ' ' + Math.round(h.d.confidence * 100) + '%';
    b.addEventListener('click', e => { t.value = h.text; fit(); lastPoint = {x:e.clientX, y:e.clientY}; render(h.d); window.scrollTo({top:0, behavior:reduce ? 'auto' : 'smooth'}); });
    li.appendChild(b); list.appendChild(li);
  });
}

fit(); renderHistory(); checkHealth();
</script>
</body>
</html>
